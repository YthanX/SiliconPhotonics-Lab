<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SNS 悬浮纳米膜三维结构</title>
  <style>
    :root{color-scheme:dark;--bg:#08101d;--fg:#edf5ff;--muted:#aab9ce;--border:#71819b;--panel:#101a2c;--si:#42a5f5;--swg:#6ac47a;--oxide:#d8ac53;--air:#30405c;--field:#7bc8ff}*{box-sizing:border-box}body{margin:0;padding:22px;background:radial-gradient(circle at 50% 0,#1a2945,var(--bg) 62%);color:var(--fg);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}main{max-width:1120px;margin:auto}h1{margin:0 0 5px;font-size:clamp(22px,3vw,32px);font-weight:500}p{margin:4px 0}.muted{color:var(--muted)}.controls,.legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.controls{justify-content:space-between;margin:14px 0 8px}.legend span,label{display:inline-flex;align-items:center;gap:6px}.sw{width:14px;height:10px}.canvas-wrap{height:570px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#111d32,#070c16)}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.fact{padding-top:10px;border-top:2px solid var(--border)}.fact strong{font-weight:500}.hint{text-align:center;margin-top:6px;color:var(--muted);font-size:13px}@media(max-width:720px){body{padding:14px}.controls{align-items:flex-start}.canvas-wrap{height:470px}.facts{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <h1>SNS：悬浮超薄硅膜如何被 SWG 支撑</h1>
  <p class="muted">中央 Si 核心沿 z 方向传光；周期 SWG 横向连接锚区，核心下方的 BOX 被局部移除并形成空气槽。</p>
  <div class="controls">
    <div class="legend"><span><i class="sw" style="background:var(--si)"></i>中央 Si 膜</span><span><i class="sw" style="background:var(--swg)"></i>SWG / 锚区</span><span><i class="sw" style="background:var(--oxide)"></i>远处 SiO₂</span><span><i class="sw" style="background:var(--air)"></i>空气槽</span></div>
    <div class="controls"><label><input id="field" type="checkbox" checked>显示倏逝场</label><label><input id="explode" type="checkbox">分层查看</label></div>
  </div>
  <div class="canvas-wrap"><canvas id="canvas" role="img" aria-label="SNS悬浮纳米膜硅波导三维结构：中央70纳米硅膜、周期SWG、两侧锚区、空气槽和远处衬底。"></canvas></div>
  <div class="hint">拖动旋转 · 双击恢复视角 · 厚度和间距为解释性放大，不按真实比例</div>
  <div class="facts"><p class="fact"><strong>光学核心：</strong>约70 nm超薄Si膜使上下束缚减弱，空气场占比提高。</p><p class="fact"><strong>支撑：</strong>周期SWG把中央膜连接到两侧锚区，也参与横向光学约束。</p><p class="fact"><strong>与SOI的差别：</strong>感测区中央下方没有连续BOX，核心由空气与远处衬底隔开。</p></div>
</main><script>
(()=>{const cv=document.getElementById('canvas'),ctx=cv.getContext('2d'),field=document.getElementById('field'),explode=document.getElementById('explode');let yaw=-.66,pitch=.48,drag=false,lx=0,ly=0;const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();function C(){return{fg:css('--fg'),border:css('--border'),panel:css('--panel'),si:css('--si'),swg:css('--swg'),oxide:css('--oxide'),air:css('--air'),field:css('--field')}}function rot(p){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=p.x*cy-p.z*sy,z=p.x*sy+p.z*cy;return{x,y:p.y*cp-z*sp,z:p.y*sp+z*cp}}function proj(p,w,h){const q=rot(p),s=Math.min(w/14.5,h/9.4);return{x:w*.5+q.x*s,y:h*.56-q.y*s,z:q.z}}function box(x0,x1,y0,y1,z0,z1,fill,alpha){const v=[{x:x0,y:y0,z:z0},{x:x1,y:y0,z:z0},{x:x1,y:y1,z:z0},{x:x0,y:y1,z:z0},{x:x0,y:y0,z:z1},{x:x1,y:y0,z:z1},{x:x1,y:y1,z:z1},{x:x0,y:y1,z:z1}];return{fill,alpha,v,f:[[0,1,2,3],[4,7,6,5],[0,4,5,1],[3,2,6,7],[1,5,6,2],[0,3,7,4]]}}function label(p,t,w,h){const c=C(),q=proj(p,w,h);ctx.save();ctx.font='500 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';const tw=ctx.measureText(t).width+10;ctx.globalAlpha=.88;ctx.fillStyle=c.panel;ctx.fillRect(q.x-tw/2,q.y-10,tw,20);ctx.globalAlpha=1;ctx.fillStyle=c.fg;ctx.fillText(t,q.x,q.y);ctx.restore()}function arrow(a,b,t,w,h){const c=C(),pa=proj(a,w,h),pb=proj(b,w,h),ang=Math.atan2(pb.y-pa.y,pb.x-pa.x);ctx.save();ctx.strokeStyle=c.fg;ctx.fillStyle=c.fg;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke();for(const [p,d] of [[pa,ang],[pb,ang+Math.PI]]){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+8*Math.cos(d+.42),p.y+8*Math.sin(d+.42));ctx.lineTo(p.x+8*Math.cos(d-.42),p.y+8*Math.sin(d-.42));ctx.closePath();ctx.fill()}ctx.restore();label({x:(a.x+b.x)/2,y:(a.y+b.y)/2+.28,z:(a.z+b.z)/2},t,w,h)}function draw(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.max(320,r.width),h=r.height;if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);const c=C(),lift=explode.checked?1.05:0,s=[];s.push(box(-5.4,5.4,-2.65,-1.72,-4.7,4.7,c.si,.55));s.push(box(-5.4,-2.75,-1.72,-.78,-4.7,4.7,c.oxide,.72),box(2.75,5.4,-1.72,-.78,-4.7,4.7,c.oxide,.72));s.push(box(-2.75,2.75,-1.72,-.18,-4.5,4.5,c.air,.22));const y0=.42+lift,y1=.63+lift;s.push(box(-1.02,1.02,y0,y1,-4.35,4.35,c.si,.96));s.push(box(-5,-3.1,y0-.06,y1+.05,-4.5,4.5,c.swg,.76),box(3.1,5,y0-.06,y1+.05,-4.5,4.5,c.swg,.76));for(let z=-3.9;z<=3.9;z+=1.12){s.push(box(-3.1,-1.02,y0-.02,y1+.02,z-.18,z+.18,c.swg,.9),box(1.02,3.1,y0-.02,y1+.02,z-.18,z+.18,c.swg,.9))}if(field.checked)s.push(box(-1.72,1.72,y0-.72,y1+.92,-4.22,4.22,c.field,.13));const fs=[];for(const o of s)for(let i=0;i<o.f.length;i++){const pts=o.f[i].map(id=>proj(o.v[id],w,h));fs.push({pts,depth:pts.reduce((a,p)=>a+p.z,0)/pts.length,fill:o.fill,alpha:o.alpha,face:i})}fs.sort((a,b)=>a.depth-b.depth);for(const f of fs){ctx.save();ctx.globalAlpha=f.alpha*(f.face===3?1:.86);ctx.fillStyle=f.fill;ctx.strokeStyle=c.border;ctx.lineWidth=.8;ctx.beginPath();f.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill();ctx.globalAlpha=Math.min(1,f.alpha+.2);ctx.stroke();ctx.restore()}label({x:0,y:y1+.65,z:-2},'超薄 Si 核心',w,h);label({x:-3.9,y:y1+.62,z:1.5},'SWG + 锚区',w,h);label({x:0,y:-.72,z:2.4},'空气槽（BOX 已移除）',w,h);label({x:3.8,y:-1.2,z:3.1},'远处 SiO₂',w,h);label({x:4.1,y:-2.2,z:2.8},'Si 衬底',w,h);arrow({x:0,y:y1+.35,z:-4.1},{x:0,y:y1+.35,z:4.1},'z：传播方向',w,h)}cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lx)*.008;pitch=Math.max(-1.05,Math.min(1.05,pitch+(e.clientY-ly)*.008));lx=e.clientX;ly=e.clientY;draw()});cv.addEventListener('pointerup',()=>drag=false);cv.addEventListener('pointercancel',()=>drag=false);cv.addEventListener('dblclick',()=>{yaw=-.66;pitch=.48;draw()});field.addEventListener('change',draw);explode.addEventListener('change',draw);new ResizeObserver(draw).observe(cv);draw()})();
</script></body></html>
