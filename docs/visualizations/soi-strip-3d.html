<div id="soi-strip-3d" aria-label="SOI 条形波导三维结构与尺寸示意">
  <style>
    #soi-strip-3d { width: 100%; color: var(--foreground); }
    #soi-strip-3d .viz-controls { justify-content: space-between; margin-bottom: 8px; }
    #soi-strip-3d .legend { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    #soi-strip-3d .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    #soi-strip-3d .swatch { width: 14px; height: 10px; display: inline-block; }
    #soi-strip-3d .si { background: var(--viz-series-1); }
    #soi-strip-3d .box { background: var(--viz-series-2); }
    #soi-strip-3d .air { background: var(--muted); border: 1px dashed var(--border); }
    #soi-strip-3d .canvas-wrap { width: 100%; min-height: 470px; position: relative; }
    #soi-strip-3d canvas { width: 100%; height: 470px; display: block; touch-action: none; cursor: grab; }
    #soi-strip-3d canvas:active { cursor: grabbing; }
    #soi-strip-3d .hint { text-align: center; margin-top: 4px; }

      #soi-strip-3d canvas { height: 410px; }
      #soi-strip-3d .viz-controls { align-items: flex-start; }
    }
  </style>

  <div class="viz-controls">
    <div class="legend text-small" aria-label="材料图例">
      <span class="legend-item"><span class="swatch si"></span>Si：顶层波导与底部衬底</span>
      <span class="legend-item"><span class="swatch box"></span>SiO₂：BOX 绝缘层</span>
      <span class="legend-item"><span class="swatch air"></span>空气：上包层</span>
    </div>
    <label class="form-check form-switch">
      <input id="soi-explode" class="form-check-input" type="checkbox">
      <span class="form-check-label">分层查看</span>
    </label>
  </div>

  <div class="canvas-wrap">
    <canvas id="soi-canvas" role="img" aria-label="SOI strip 波导：3 微米宽、220 纳米厚的硅波导位于 2 微米厚的二氧化硅 BOX 上，BOX 下方为硅衬底，波导沿 z 方向传播。"></canvas>
  </div>
  <div class="hint text-small text-muted">拖动旋转 · 双击恢复视角 · 示意图不按真实纵横比例绘制</div>

  <script>
    (() => {
      const root = document.getElementById('soi-strip-3d');
      const canvas = document.getElementById('soi-canvas');
      const explode = document.getElementById('soi-explode');
      const ctx = canvas.getContext('2d');
      let yaw = -0.62;
      let pitch = 0.48;
      let dragging = false;
      let lastX = 0;
      let lastY = 0;

      function css(name) {
        return getComputedStyle(root).getPropertyValue(name).trim();
      }

      function colors() {
        return {
          fg: css('--foreground'),
          muted: css('--muted-foreground'),
          border: css('--border'),
          popover: css('--popover'),
          si: css('--viz-series-1'),
          oxide: css('--viz-series-2'),
          air: css('--muted')
        };
      }

      function rotate(p) {
        const cy = Math.cos(yaw), sy = Math.sin(yaw);
        const cp = Math.cos(pitch), sp = Math.sin(pitch);
        const x1 = p.x * cy - p.z * sy;
        const z1 = p.x * sy + p.z * cy;
        return { x: x1, y: p.y * cp - z1 * sp, z: p.y * sp + z1 * cp };
      }

      function project(p, w, h) {
        const r = rotate(p);
        const scale = Math.min(w / 12.5, h / 8.4);
        return { x: w * 0.5 + r.x * scale, y: h * 0.55 - r.y * scale, z: r.z };
      }

      function cuboid(x0, x1, y0, y1, z0, z1, fill, name) {
        const v = [
          {x:x0,y:y0,z:z0},{x:x1,y:y0,z:z0},{x:x1,y:y1,z:z0},{x:x0,y:y1,z:z0},
          {x:x0,y:y0,z:z1},{x:x1,y:y0,z:z1},{x:x1,y:y1,z:z1},{x:x0,y:y1,z:z1}
        ];
        return {
          name, fill, vertices: v,
          faces: [[0,1,2,3],[4,7,6,5],[0,4,5,1],[3,2,6,7],[1,5,6,2],[0,3,7,4]]
        };
      }

      function arrow(a, b, label, w, h, offsetX = 0, offsetY = 0) {
        const c = colors();
        const pa = project(a,w,h), pb = project(b,w,h);
        ctx.save();
        ctx.strokeStyle = c.fg;
        ctx.fillStyle = c.fg;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
        const angle = Math.atan2(pb.y-pa.y,pb.x-pa.x);
        for (const [p,ang] of [[pa,angle],[pb,angle+Math.PI]]) {
          ctx.beginPath();
          ctx.moveTo(p.x,p.y);
          ctx.lineTo(p.x+9*Math.cos(ang+0.42),p.y+9*Math.sin(ang+0.42));
          ctx.lineTo(p.x+9*Math.cos(ang-0.42),p.y+9*Math.sin(ang-0.42));
          ctx.closePath(); ctx.fill();
        }
        labelAt((pa.x+pb.x)/2+offsetX,(pa.y+pb.y)/2+offsetY,label,c);
        ctx.restore();
      }

      function labelAt(x, y, text, c, align = 'center') {
        ctx.save();
        ctx.font = '500 13px system-ui, sans-serif';
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        const width = ctx.measureText(text).width + 10;
        const left = align === 'center' ? x-width/2 : x;
        ctx.globalAlpha = 0.88;
        ctx.fillStyle = c.popover;
        ctx.fillRect(left,y-10,width,20);
        ctx.globalAlpha = 1;
        ctx.fillStyle = c.fg;
        ctx.fillText(text,x,y);
        ctx.restore();
      }

      function draw() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.max(320, rect.width);
        const h = rect.height;
        if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)) {
          canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
        }
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.clearRect(0,0,w,h);
        const c = colors();
        const gap = explode.checked ? 0.55 : 0;
        const substrate = cuboid(-4,4,-2.25,-0.85,-4.3,4.3,c.si,'Si 衬底');
        const box = cuboid(-4,4,-0.85+gap,-0.05+gap,-4.3,4.3,c.oxide,'SiO₂ BOX');
        const wgBottom = -0.05 + gap + (explode.checked ? 0.45 : 0);
        const waveguide = cuboid(-1.5,1.5,wgBottom,wgBottom+0.62,-4.3,4.3,c.si,'顶层 Si strip');
        const solids = [substrate,box,waveguide];
        const faces = [];
        for (const solid of solids) {
          for (let i=0;i<solid.faces.length;i++) {
            const ids = solid.faces[i];
            const pts = ids.map(id => project(solid.vertices[id],w,h));
            faces.push({pts, depth: pts.reduce((s,p)=>s+p.z,0)/pts.length, fill:solid.fill, face:i});
          }
        }
        faces.sort((a,b)=>a.depth-b.depth);
        for (const f of faces) {
          ctx.save();
          ctx.globalAlpha = f.face === 3 ? 0.96 : (f.face === 4 || f.face === 5 ? 0.78 : 0.66);
          ctx.fillStyle = f.fill;
          ctx.strokeStyle = c.border;
          ctx.lineWidth = 1;
          ctx.beginPath();
          f.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
          ctx.closePath(); ctx.fill(); ctx.globalAlpha=1; ctx.stroke(); ctx.restore();
        }

        const frontZ = -4.65;
        arrow({x:-1.5,y:wgBottom+0.92,z:frontZ},{x:1.5,y:wgBottom+0.92,z:frontZ},'W = 3 μm（波导宽度）',w,h,0,-13);
        arrow({x:2.25,y:wgBottom,z:frontZ},{x:2.25,y:wgBottom+0.62,z:frontZ},'H = 220 nm',w,h,45,0);
        arrow({x:-4.45,y:-0.85+gap,z:frontZ},{x:-4.45,y:-0.05+gap,z:frontZ},'BOX = 2 μm',w,h,-43,0);
        arrow({x:-3.2,y:wgBottom+1.8,z:-2.5},{x:-3.2,y:wgBottom+1.8,z:2.4},'z：传播方向',w,h,0,-12);

        const airP = project({x:2.6,y:wgBottom+2.0,z:0},w,h);
        labelAt(airP.x,airP.y,'空气上包层',c);
        const wgP = project({x:0,y:wgBottom+0.35,z:-4.45},w,h);
        labelAt(wgP.x,wgP.y,'顶层 Si：刻成 strip',c);
        const boxP = project({x:2.7,y:-0.45+gap,z:-4.45},w,h);
        labelAt(boxP.x,boxP.y,'SiO₂ BOX：绝缘层',c);
        const subP = project({x:1.9,y:-1.58,z:-4.45},w,h);
        labelAt(subP.x,subP.y,'Si 衬底：承载整片晶圆',c);

        const origin = project({x:-3.5,y:-2.35,z:-3.8},w,h);
        const axX = project({x:-2.4,y:-2.35,z:-3.8},w,h);
        const axY = project({x:-3.5,y:-1.25,z:-3.8},w,h);
        const axZ = project({x:-3.5,y:-2.35,z:-2.7},w,h);
        ctx.strokeStyle=c.fg; ctx.fillStyle=c.fg; ctx.lineWidth=1.3;
        for (const [p,t] of [[axX,'x'],[axY,'y'],[axZ,'z']]) {
          ctx.beginPath(); ctx.moveTo(origin.x,origin.y); ctx.lineTo(p.x,p.y); ctx.stroke();
          ctx.font='500 12px system-ui, sans-serif'; ctx.fillText(t,p.x+4,p.y-3);
        }
      }

      canvas.addEventListener('pointerdown', e => {
        dragging=true; lastX=e.clientX; lastY=e.clientY; canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointermove', e => {
        if(!dragging) return;
        yaw += (e.clientX-lastX)*0.008;
        pitch = Math.max(-0.1,Math.min(1.15,pitch+(e.clientY-lastY)*0.006));
        lastX=e.clientX; lastY=e.clientY; draw();
      });
      canvas.addEventListener('pointerup', () => dragging=false);
      canvas.addEventListener('pointercancel', () => dragging=false);
      canvas.addEventListener('dblclick', () => { yaw=-0.62; pitch=0.48; draw(); });
      explode.addEventListener('change', draw);
      new ResizeObserver(draw).observe(root);
      new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['class','style']});
      draw();
    })();
  </script>
</div>
</body>
