.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

}

  height: 100%;

  width: 14px;
  height: 14px;

}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);

}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);

}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible {

  outline-offset: 2px;
}

svg {

#widget &gt; svg {

}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-destructive {

}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;

  &lt;/style&gt;

  &lt;div class=&quot;wm-head&quot;&gt;

    &lt;/label&gt;

    &lt;/label&gt;

      &lt;div class=&quot;legend text-small&quot;&gt;

        &lt;span&gt;&lt;i class=&quot;swatch swatch-fast&quot;&gt;&lt;/i&gt;叠加后瞬时波长&lt;/span&gt;
      &lt;/div&gt;
      &lt;svg id=&quot;wm-fast-svg&quot; role=&quot;img&quot; aria-label=&quot;一毫秒局部窗口中的两千赫兹小幅波长调制&quot;&gt;&lt;/svg&gt;

      &lt;div class=&quot;legend text-small&quot;&gt;
        &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:var(--muted-foreground)&quot;&gt;&lt;/i&gt;氮气空白4 kHz背景&lt;/span&gt;
        &lt;span&gt;&lt;i class=&quot;swatch swatch-output&quot;&gt;&lt;/i&gt;含甲烷时测得的4 kHz&lt;/span&gt;
        &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:var(--viz-series-5)&quot;&gt;&lt;/i&gt;相减后甲烷贡献&lt;/span&gt;
      &lt;/div&gt;
      &lt;svg id=&quot;wm-extract-svg&quot; role=&quot;img&quot; aria-label=&quot;氮气空白、含甲烷信号和相减后的四千赫兹分量&quot;&gt;&lt;/svg&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;wms-modulation-demo&#x27;);
      const playButton = document.getElementById(&#x27;wm-play&#x27;);
      const fastToggle = document.getElementById(&#x27;wm-fast-toggle&#x27;);
      const positionInput = document.getElementById(&#x27;wm-position&#x27;);
      const positionValue = document.getElementById(&#x27;wm-position-value&#x27;);
      const concentrationInput = document.getElementById(&#x27;wm-concentration&#x27;);
      const concentrationValue = document.getElementById(&#x27;wm-concentration-value&#x27;);
      const status = document.getElementById(&#x27;wm-status&#x27;);
      const absSvg = document.getElementById(&#x27;wm-abs-svg&#x27;);
      const slowSvg = document.getElementById(&#x27;wm-slow-svg&#x27;);
      const fastSvg = document.getElementById(&#x27;wm-fast-svg&#x27;);
      const extractSvg = document.getElementById(&#x27;wm-extract-svg&#x27;);
      let playing = true;
      let scan = 0;
      let fastPhase = 0;
      let lastTime = performance.now();

      const clamp = (v, a, b) =&gt; Math.max(a, Math.min(b, v));
      const transmission = (d, concentration=1) =&gt; 1 - 0.55 * concentration * Math.exp(-0.5 * Math.pow(d / 0.72, 2));
      const sx = (v, a, b, left, right) =&gt; left + (v - a) * (right - left) / (b - a);
      const sy = (v, a, b, top, bottom) =&gt; bottom - (v - a) * (bottom - top) / (b - a);
      const path = points =&gt; points.map((p, i) =&gt; `${i ? &#x27;L&#x27; : &#x27;M&#x27;}${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(&#x27; &#x27;);

      function frame(svg, title, desc) {
        const w = Math.max(320, svg.getBoundingClientRect().width);
        const h = svg.getBoundingClientRect().height || 210;
        svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${w} ${h}`);
        svg.innerHTML = `&lt;title&gt;${title}&lt;/title&gt;&lt;desc&gt;${desc}&lt;/desc&gt;`;
        return {w, h, l: 58, r: 16, t: 20, b: 38};
      }

      function axes(svg, g, xLabel, yLabel) {
        const x0 = g.l, x1 = g.w - g.r, y0 = g.t, y1 = g.h - g.b;
        svg.insertAdjacentHTML(&#x27;beforeend&#x27;, `
          &lt;line class=&quot;axis&quot; x1=&quot;${x0}&quot; y1=&quot;${y1}&quot; x2=&quot;${x1}&quot; y2=&quot;${y1}&quot;&gt;&lt;/line&gt;
          &lt;line class=&quot;axis&quot; x1=&quot;${x0}&quot; y1=&quot;${y0}&quot; x2=&quot;${x0}&quot; y2=&quot;${y1}&quot;&gt;&lt;/line&gt;
          &lt;text x=&quot;${(x0+x1)/2}&quot; y=&quot;${g.h-8}&quot; text-anchor=&quot;middle&quot;&gt;${xLabel}&lt;/text&gt;
          &lt;text x=&quot;14&quot; y=&quot;${(y0+y1)/2}&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 14 ${(y0+y1)/2})&quot;&gt;${yLabel}&lt;/text&gt;
        `);
      }

      function drawAbsorption() {
        const g = frame(absSvg, &#x27;甲烷吸收线上的扫描位置&#x27;, &#x27;蓝色虚线是5赫兹慢扫描中心，橙色实线是叠加2千赫兹调制后的瞬时波长。&#x27;);
        axes(absSvg, g, &#x27;相对吸收中心的波长位置&#x27;, &#x27;透射率&#x27;);
        const x0=g.l, x1=g.w-g.r, y0=g.t, y1=g.h-g.b;
        const pts=[];
        const concentration=Number(concentrationInput.value)/100;
        for(let i=0;i&lt;=240;i++) {
          const d=-3+6*i/240;
          pts.push([sx(d,-3,3,x0,x1), sy(transmission(d,concentration),0.35,1.05,y0,y1)]);
        }
        const center=-2.55+5.10*scan;
        const instant=center+(fastToggle.checked ? 0.28*Math.sin(fastPhase) : 0);
        const cx=sx(center,-3,3,x0,x1);
        const ix=sx(clamp(instant,-3,3),-3,3,x0,x1);
        const iy=sy(transmission(instant,concentration),0.35,1.05,y0,y1);
        absSvg.insertAdjacentHTML(&#x27;beforeend&#x27;, `
          &lt;line class=&quot;gridline&quot; x1=&quot;${x0}&quot; y1=&quot;${sy(1,0.35,1.05,y0,y1)}&quot; x2=&quot;${x1}&quot; y2=&quot;${sy(1,0.35,1.05,y0,y1)}&quot;&gt;&lt;/line&gt;
          &lt;path class=&quot;absorb&quot; d=&quot;${path(pts)}&quot;&gt;&lt;/path&gt;
          &lt;line class=&quot;guide-slow&quot; x1=&quot;${cx}&quot; y1=&quot;${y0}&quot; x2=&quot;${cx}&quot; y2=&quot;${y1}&quot;&gt;&lt;/line&gt;
          &lt;line class=&quot;guide-fast&quot; x1=&quot;${ix}&quot; y1=&quot;${y0}&quot; x2=&quot;${ix}&quot; y2=&quot;${y1}&quot;&gt;&lt;/line&gt;
          &lt;circle class=&quot;dot-slow&quot; cx=&quot;${cx}&quot; cy=&quot;${y0+10}&quot; r=&quot;5&quot;&gt;&lt;/circle&gt;
          &lt;circle class=&quot;dot-fast&quot; cx=&quot;${ix}&quot; cy=&quot;${iy}&quot; r=&quot;6&quot;&gt;&lt;/circle&gt;
          &lt;text x=&quot;${x0}&quot; y=&quot;${y1+18}&quot; text-anchor=&quot;middle&quot;&gt;左侧&lt;/text&gt;
          &lt;text x=&quot;${(x0+x1)/2}&quot; y=&quot;${y1+18}&quot; text-anchor=&quot;middle&quot;&gt;吸收中心&lt;/text&gt;
          &lt;text x=&quot;${x1}&quot; y=&quot;${y1+18}&quot; text-anchor=&quot;middle&quot;&gt;右侧&lt;/text&gt;
        `);
      }

      function drawSlowScan() {
        const g = frame(slowSvg, &#x27;五赫兹慢扫描&#x27;, &#x27;蓝线在200毫秒内扫过整条吸收线，另一条线显示对应的探测器吸收凹陷。&#x27;);
        axes(slowSvg, g, &#x27;时间（ms）&#x27;, &#x27;归一化量&#x27;);
        const x0=g.l, x1=g.w-g.r, y0=g.t, y1=g.h-g.b;
        const wave=[], out=[];
        const concentration=Number(concentrationInput.value)/100;
        for(let i=0;i&lt;=220;i++) {
          const q=i/220;
          const d=-2.55+5.10*q;
          wave.push([sx(200*q,0,200,x0,x1),sy(q,0,1,y0,y1)]);
          out.push([sx(200*q,0,200,x0,x1),sy((transmission(d,concentration)-0.4)/0.6,0,1,y0,y1)]);
        }
        const nowX=sx(scan*200,0,200,x0,x1);
        slowSvg.insertAdjacentHTML(&#x27;beforeend&#x27;, `
          &lt;path class=&quot;slow&quot; d=&quot;${path(wave)}&quot;&gt;&lt;/path&gt;
          &lt;path class=&quot;output&quot; d=&quot;${path(out)}&quot;&gt;&lt;/path&gt;
          &lt;line class=&quot;guide-fast&quot; x1=&quot;${nowX}&quot; y1=&quot;${y0}&quot; x2=&quot;${nowX}&quot; y2=&quot;${y1}&quot;&gt;&lt;/line&gt;
          &lt;text x=&quot;${x0}&quot; y=&quot;${y1+18}&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;
          &lt;text x=&quot;${(x0+x1)/2}&quot; y=&quot;${y1+18}&quot; text-anchor=&quot;middle&quot;&gt;100&lt;/text&gt;
          &lt;text x=&quot;${x1}&quot; y=&quot;${y1+18}&quot; text-anchor=&quot;middle&quot;&gt;200&lt;/text&gt;
        `);
      }

      function drawFastZoom() {
        const g = frame(fastSvg, &#x27;两千赫兹局部调制&#x27;, &#x27;在一毫秒局部窗口内，瞬时波长围绕慢扫描中心完成两次小幅摆动。&#x27;);
        axes(fastSvg, g, &#x27;局部时间（ms）&#x27;, &#x27;相对波长&#x27;);
        const x0=g.l, x1=g.w-g.r, y0=g.t, y1=g.h-g.b;
        const center=-2.55+5.10*scan;
        const cNorm=0.5;
        const base=[[x0,sy(cNorm,0,1,y0,y1)],[x1,sy(cNorm,0,1,y0,y1)]];
        const fast=[];
        for(let i=0;i&lt;=180;i++) {
          const q=i/180;
          const val=cNorm+(fastToggle.checked ? 0.28*Math.sin(4*Math.PI*q+fastPhase) : 0);
          fast.push([sx(q,0,1,x0,x1),sy(val,0,1,y0,y1)]);
        }
        fastSvg.insertAdjacentHTML(&#x27;beforeend&#x27;, `
          &lt;path class=&quot;guide-slow&quot; d=&quot;${path(base)}&quot;&gt;&lt;/path&gt;
          &lt;path class=&quot;fast&quot; d=&quot;${path(fast)}&quot;&gt;&lt;/path&gt;
          &lt;text x=&quot;${x0}&quot; y=&quot;${y1+18}&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;
          &lt;text x=&quot;${(x0+x1)/2}&quot; y=&quot;${y1+18}&quot; text-anchor=&quot;middle&quot;&gt;0.5&lt;/text&gt;
          &lt;text x=&quot;${x1}&quot; y=&quot;${y1+18}&quot; text-anchor=&quot;middle&quot;&gt;1.0&lt;/text&gt;
          &lt;text class=&quot;muted&quot; x=&quot;${x1-4}&quot; y=&quot;${y0+14}&quot; text-anchor=&quot;end&quot;&gt;当前慢扫描中心：${center.toFixed(2)}&lt;/text&gt;
        `);
      }

      function drawExtraction() {
        const g = frame(extractSvg, &#x27;四千赫兹空白扣除&#x27;, &#x27;灰线是氮气空白背景，另一条线是含甲烷测量，相减后留下与甲烷相关的四千赫兹分量。&#x27;);
        axes(extractSvg, g, &#x27;局部时间（ms）&#x27;, &#x27;锁相输入幅值&#x27;);
        const x0=g.l, x1=g.w-g.r, y0=g.t, y1=g.h-g.b;
        const concentration=Number(concentrationInput.value)/100;
        const center=-2.55+5.10*scan;
        const lineSensitivity=Math.exp(-0.5*Math.pow(center/0.95,2));
        const blank=[], gas=[], difference=[];
        for(let i=0;i&lt;=240;i++) {
          const q=i/240;
          const carrier=Math.cos(8*Math.PI*q);
          const blankValue=0.5+0.035*carrier;
          const methaneValue=0.19*concentration*lineSensitivity*carrier;
          blank.push([sx(q,0,1,x0,x1),sy(blankValue,0.2,0.8,y0,y1)]);
          gas.push([sx(q,0,1,x0,x1),sy(blankValue+methaneValue,0.2,0.8,y0,y1)]);
          difference.push([sx(q,0,1,x0,x1),sy(0.5+methaneValue,0.2,0.8,y0,y1)]);
        }
        extractSvg.insertAdjacentHTML(&#x27;beforeend&#x27;, `
          &lt;line class=&quot;gridline&quot; x1=&quot;${x0}&quot; y1=&quot;${sy(0.5,0.2,0.8,y0,y1)}&quot; x2=&quot;${x1}&quot; y2=&quot;${sy(0.5,0.2,0.8,y0,y1)}&quot;&gt;&lt;/line&gt;
          &lt;path class=&quot;blank&quot; d=&quot;${path(blank)}&quot;&gt;&lt;/path&gt;
          &lt;path class=&quot;output&quot; d=&quot;${path(gas)}&quot;&gt;&lt;/path&gt;
          &lt;path class=&quot;difference&quot; d=&quot;${path(difference)}&quot;&gt;&lt;/path&gt;
          &lt;text x=&quot;${x0}&quot; y=&quot;${y1+18}&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;
          &lt;text x=&quot;${(x0+x1)/2}&quot; y=&quot;${y1+18}&quot; text-anchor=&quot;middle&quot;&gt;0.5&lt;/text&gt;
          &lt;text x=&quot;${x1}&quot; y=&quot;${y1+18}&quot; text-anchor=&quot;middle&quot;&gt;1.0&lt;/text&gt;
          &lt;text class=&quot;muted&quot; x=&quot;${x1-4}&quot; y=&quot;${y0+14}&quot; text-anchor=&quot;end&quot;&gt;1 ms内正好4个4 kHz周期&lt;/text&gt;
        `);
      }

      function render() {
        positionInput.value=(scan*100).toFixed(1);
        positionValue.textContent=(scan*100).toFixed(1);
        concentrationValue.textContent=concentrationInput.value;
        const center=-2.55+5.10*scan;
        const instant=center+(fastToggle.checked ? 0.28*Math.sin(fastPhase) : 0);
        status.textContent=`慢扫描中心 ${center.toFixed(2)}；瞬时波长位置 ${instant.toFixed(2)}；甲烷 ${concentrationInput.value}%；2 kHz调制${fastToggle.checked?&#x27;已开启（慢动作）&#x27;:&#x27;已关闭&#x27;}`;
        drawAbsorption();
        drawSlowScan();
        drawFastZoom();
        drawExtraction();
      }

      function animate(now) {
        const dt=Math.min(50,now-lastTime);
        lastTime=now;
        if(playing) {
          scan=(scan+dt/7000)%1;
          fastPhase=(fastPhase+dt*0.012)%(Math.PI*2);
          render();
        }
        requestAnimationFrame(animate);
      }

      playButton.addEventListener(&#x27;click&#x27;,()=&gt;{
        playing=!playing;
        playButton.textContent=playing?&#x27;暂停&#x27;:&#x27;播放&#x27;;
        playButton.setAttribute(&#x27;aria-pressed&#x27;,String(playing));
      });
      fastToggle.addEventListener(&#x27;change&#x27;,render);
      concentrationInput.addEventListener(&#x27;input&#x27;,render);
      positionInput.addEventListener(&#x27;input&#x27;,()=&gt;{
        scan=Number(positionInput.value)/100;
        playing=false;
        playButton.textContent=&#x27;播放&#x27;;
        playButton.setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;);
        render();
      });
      new ResizeObserver(render).observe(root);
      render();
      requestAnimationFrame(animate);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
